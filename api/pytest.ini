[pytest]
DJANGO_SETTINGS_MODULE = virtual_bank.test_settings
# Legacy tests.py files in other apps hit a live server; only the new suites run here.
testpaths = transactions virtual_bank
python_files = test_*.py
addopts =
    --no-migrations
    --strict-markers
    -p no:cacheprovider
markers =
    txn: transaction-processing control domain
    authn: authentication control domain
    authz: authorization / object-ownership control domain
    pii: PII-handling control domain
    audit: audit-logging control domain
    validation: data-validation control domain
filterwarnings =
    ignore::DeprecationWarning
